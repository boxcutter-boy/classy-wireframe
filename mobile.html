<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Classy — Mobile Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Instrument+Sans:ital@0;1&family=Instrument+Serif:ital@0;1&family=Jacquard+24&family=Monoton&family=Rubik+Dirt&family=Ruthie&family=Sancreek&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f4;
    --panel:#ffffff;
    --page:#e6e6e6;          /* backdrop behind the phone column */
    --rail-ink:#f4f4f4;
    --line:#c9c9c9;
    --line-strong:#8f8f8f;
    --fill:#ececec;
    --fill-2:#f7f7f7;
    --ink:#1f1f1f;
    --muted:#828282;
    --news-bg:#fcfcf8; --news-ink:#161616; --news-rule:#bcbcb2; --news-muted:#6d6d66;
    --radius:6px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  body.dark{
    --bg:#242424; --panel:#2e2e2e; --page:#101010; --rail-ink:#e8e8e8;
    --line:#484848; --line-strong:#6a6a6a; --fill:#3a3a3a; --fill-2:#333; --ink:#e8e8e8; --muted:#ababab;
    --news-bg:#262624; --news-ink:#e9e9e4; --news-rule:#4c4c48; --news-muted:#a7a79f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--page);display:flex;justify-content:center;overflow:hidden}
  button{font-family:inherit;cursor:pointer;color:inherit}

  /* ---------- Phone shell ---------- */
  .app{
    position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 0 0 1px var(--line), 0 18px 60px rgba(0,0,0,.22);
  }
  @media (min-width:470px){ .app{height:min(100dvh,900px);margin:auto;border-radius:26px} }

  /* ---------- Top app bar ---------- */
  .appbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--bg);
  }
  .appbar-titles{min-width:0}
  .appbar h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .issue{font-family:var(--serif);font-size:12.5px;color:var(--muted);margin-top:3px}
  .appbar-actions{display:flex;gap:7px;flex:0 0 auto}
  .iconbtn{width:38px;height:38px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
  .iconbtn svg{width:20px;height:20px}
  .iconbtn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  /* feed view toggle: newspaper ⇄ feed (icon-only segmented control) */
  .viewseg{display:inline-flex;align-items:center;height:38px;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;flex:0 0 auto}
  .viewseg button{display:flex;align-items:center;justify-content:center;background:var(--panel);border:0;color:var(--muted);padding:0 11px;height:100%}
  .viewseg button + button{border-left:1px solid var(--line-strong)}
  .viewseg button.active{background:var(--ink);color:var(--panel)}
  .viewseg button svg{width:19px;height:19px;display:block}

  /* ---------- Scroll region ---------- */
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px 30px}

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--panel);
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  .tab{flex:1;position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:var(--muted);font-size:10.5px;letter-spacing:.02em}
  .tab svg{width:23px;height:23px}
  .tab.active{color:var(--ink)}
  .tab.active .tlab{font-weight:600}
  .tab-badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--ink);color:var(--panel);font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center}
  body.dark .tab-badge{color:#1c1c1c}
  .tab-badge.show{display:inline-flex}

  /* ---------- Feed: horoscope ---------- */
  .horoscope{text-align:center;margin:0 0 22px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .horo-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .horo-text{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.55;color:var(--ink);margin:8px 0 0}

  /* ---------- Feed: read (single column) ---------- */
  .feed-col{display:flex;flex-direction:column;gap:16px}
  .card{
    background:var(--panel);border:1.5px solid var(--line-strong);border-radius:var(--radius);
    padding:18px;text-align:left;display:block;width:100%;margin:0;cursor:pointer;
    transition:border-color .12s ease, box-shadow .12s ease, transform .08s ease;
  }
  .card:active{transform:scale(.992)}
  /* ad typography (global): decorative font ONLY on the name; all-caps headline + body share the body font */
  .ad-name{font-weight:500;font-size:calc(26px * var(--fscale,1));line-height:1.05;color:var(--ink);margin:0 0 6px}
  .ad-place{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .ad-headline{font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;line-height:1.3;color:var(--ink);margin:0 0 11px}
  .ad-body{font-size:13.5px;line-height:1.5;color:var(--ink);margin:0}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
  .tag-chip{font-size:11px;padding:4px 9px;background:var(--fill);border:1px solid var(--line);border-radius:4px;color:var(--muted)}
  .card.replied{background:var(--fill-2)}
  .card.replied .ad-name,.card.replied .ad-headline,.card.replied .ad-body,.card.replied .tags{opacity:.45}
  .card.replied:active{transform:none}
  .replied-note{display:flex;align-items:center;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .replied-note::before{content:'✓';display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:10px;flex:none}

  /* ---------- Feed: The Paper (zoomed-out classifieds page) ---------- */
  .scroll.paper-mode{padding:0;overflow:hidden;position:relative}
  .paper-viewport{position:absolute;inset:0;overflow:hidden;background:var(--news-bg);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .paper-viewport:active{cursor:grabbing}
  .paper{transform-origin:0 0;background:var(--news-bg);color:var(--news-ink);padding:16px 20px 22px;font-family:var(--serif);will-change:transform}
  .masthead{text-align:center;border-bottom:3px double var(--news-ink);padding-bottom:9px;margin-bottom:13px}
  .mast-title{font-family:var(--serif);font-weight:700;font-size:56px;line-height:.86;letter-spacing:-.01em}
  .mast-sub{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--news-muted);margin-top:9px;border-top:1px solid var(--news-rule);padding-top:6px}
  .paper-cols{column-count:5;column-gap:14px;column-rule:1px solid var(--news-rule)}
  .clip{display:block;width:100%;text-align:left;background:none;border:0;padding:0 0 9px;margin:0 0 9px;border-bottom:1px solid var(--news-rule);break-inside:avoid;cursor:pointer;color:inherit;font-family:inherit}
  .clip-name{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:500;font-size:calc(12px * var(--fscale,1));line-height:1.05;color:var(--news-ink)}
  .clip-rep-ic{width:12px;height:12px;flex:0 0 auto;color:var(--news-ink)}
  .clip-head{font-weight:700;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.18;margin:3px 0;color:var(--news-ink)}
  .clip-body{font-size:9px;line-height:1.34;color:var(--news-ink);opacity:.92}
  .clip-loc{font-size:8px;font-style:italic;color:var(--news-muted);margin-top:3px}
  .clip.replied{opacity:.66}
  .paper-foot{text-align:center;font-size:12px;letter-spacing:.22em;color:var(--news-muted);margin-top:16px;font-family:var(--font)}
  .paper-zoom{position:absolute;right:12px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:7px}
  .paper-zoom button{width:40px;height:40px;border:1px solid var(--line-strong);border-radius:11px;background:var(--panel);color:var(--ink);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 9px rgba(0,0,0,.14)}
  .paper-hint{position:absolute;left:12px;bottom:20px;z-index:5;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:0 2px 9px rgba(0,0,0,.12)}

  /* ---------- Feed: end of the paper ---------- */
  .endpaper{text-align:center;padding:38px 12px 8px;color:var(--muted)}
  .endpaper .rule{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
  .endpaper .rule::before,.endpaper .rule::after{content:'';height:1px;background:var(--line-strong);width:52px;opacity:.7}
  .endpaper .mark{font-size:18px;color:var(--muted)}
  .endpaper h4{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 6px;color:var(--ink)}
  .endpaper p{font-size:13px;line-height:1.55;margin:0 auto;max-width:270px}

  /* ---------- Feed gate (no ad posted) ---------- */
  .feed-locked{position:relative;overflow:hidden;max-height:560px}
  .feed-locked .card{pointer-events:none}
  .feed-blur{position:absolute;left:-12px;right:-12px;bottom:0;height:70%;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);background:linear-gradient(to bottom, rgba(0,0,0,0), var(--bg) 82%)}
  .feed-gate{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;z-index:2;padding:0 6px}
  .feed-gate-card{background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;padding:24px 22px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.16)}
  .feed-gate-card h3{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 10px}
  .feed-gate-card p{font-size:14px;color:var(--muted);line-height:1.55;margin:0 0 18px}

  /* ---------- Bottom sheet overlay ---------- */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:50}
  .overlay.open{display:flex}
  .sheet{
    background:var(--panel);width:100%;max-height:92%;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 34px rgba(0,0,0,.24);animation:sheetUp .22s ease;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  .sheet::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--line-strong);opacity:.55;margin:0 auto 12px}
  .sheet .close{float:right;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:18px}
  .sheet .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .sheet h3{font-family:var(--serif);font-weight:500;font-size:calc(25px * var(--fscale,1));margin:8px 0 16px;line-height:1.15}
  .sheet p{font-size:14px;line-height:1.6;margin:0 0 18px}
  .sheet .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;border-top:1px solid var(--line);padding-top:16px;margin-bottom:20px}
  .sheet .meta div{font-size:13px}
  .sheet .meta span{color:var(--muted)}
  /* ad detail as a centered card modal (not a bottom sheet) */
  .overlay.card-modal{align-items:center;justify-content:center;padding:22px 18px}
  .overlay.card-modal .sheet{max-width:440px;border-radius:16px;max-height:88vh;padding:24px 22px;box-shadow:0 18px 46px rgba(0,0,0,.3);animation:modalIn .18s ease}
  .overlay.card-modal .sheet::before{display:none}
  @keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:8px;font-size:14px;border:1.5px solid var(--ink);background:var(--ink);color:var(--panel)}
  body.dark .btn{color:#1c1c1c;background:var(--ink);border-color:var(--ink)}
  .btn.ghost{background:var(--panel);color:var(--ink)}
  .btn.block{width:100%}
  .btn.sm{padding:9px 15px;font-size:13px}
  .btn:disabled{background:var(--fill);color:var(--muted);border-color:var(--line-strong);cursor:default}

  /* ---------- Messages list ---------- */
  .mlist{display:flex;flex-direction:column;gap:12px}
  .mrow{background:var(--panel);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:16px;text-align:left;display:flex;gap:14px;align-items:flex-start;width:100%}
  .mrow .kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .mrow p{font-size:13px;line-height:1.5;color:var(--muted);margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mrow-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
  .unread-dot{width:9px;height:9px;border-radius:50%;background:var(--ink)}
  .mrow.unread .who-name{font-weight:700}
  .mrow.unread p{color:var(--ink)}
  .when{font-size:12px;color:var(--muted);white-space:nowrap}
  .who-name{font-family:var(--serif);font-weight:500;font-size:calc(19px * var(--fscale,1));line-height:1.2;margin:0}
  .who-cap{font-size:12.5px;color:var(--muted);margin-top:3px}
  .sender{font-weight:600;color:var(--ink)}

  /* ---------- Messages tabs & requests ---------- */
  .tabs{display:flex;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .mtab{background:none;border:0;padding:11px 2px;margin-right:24px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .mtab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .mtab .count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--panel);font-size:11px;margin-left:7px;font-weight:600;vertical-align:middle}
  body.dark .mtab .count{color:#1c1c1c}
  .req{background:var(--panel);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:16px}
  .req .kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .req .their-msg{font-size:14px;line-height:1.55;margin:14px 0}
  .req .their-msg .wrote{font-weight:600;color:var(--ink)}
  .req .their-msg .msg-text{font-style:italic}
  .req-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .req-actions .link-btn{margin-right:auto}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .empty-msg{color:var(--muted);font-size:14px;line-height:1.6;padding:20px 0}
  .link-btn{background:none;border:0;color:var(--ink);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:4px}

  /* ---------- Confirm sheets / block ---------- */
  .block-check{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font-size:13px;color:var(--ink);line-height:1.45;border:1.5px solid var(--line-strong);border-radius:6px;padding:12px 14px;margin:16px 0 20px;background:var(--panel)}
  .block-check .bx{width:16px;height:16px;border:1.5px solid var(--line-strong);border-radius:3px;flex:0 0 auto;margin-top:1px}
  .block-check.sel{border-color:var(--ink);background:var(--fill)}
  .block-check.sel .bx{background:var(--ink);border-color:var(--ink)}
  .confirm-actions{display:flex;justify-content:flex-end;gap:12px}
  .btn.danger-btn{background:#b23b3b;border-color:#b23b3b;color:#fff}
  body.dark .btn.danger-btn{background:#c25454;border-color:#c25454;color:#fff}

  /* ---------- Thread ---------- */
  .thread{display:flex;flex-direction:column;min-height:100%}
  .back{background:none;border:0;color:var(--muted);font-size:13px;padding:0;display:flex;gap:6px;align-items:center}
  .scroll.thread-mode{padding-top:0;padding-bottom:0}
  .thread-head{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;margin:0 -18px 16px;padding:16px 18px 12px;border-bottom:1px solid var(--line-strong)}
  .th-icon{background:none;border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:5px;flex:0 0 auto}
  .th-icon svg{width:22px;height:22px}
  .th-name{background:none;border:0;color:var(--ink);font-family:var(--serif);font-weight:500;font-size:calc(21px * var(--fscale,1));line-height:1.05;padding:2px 0;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .th-name:hover{text-decoration:underline;text-underline-offset:3px}
  .th-actions{margin-left:auto;display:flex;align-items:center;gap:2px;flex:0 0 auto}
  .th-block{color:var(--muted)}
  .th-block:active{color:#b23b3b}
  /* face-reveal eye + tooltip (greyed until a mutual reveal is unlocked) */
  .th-eye-wrap{position:relative;display:flex}
  .th-eye{position:relative;background:none;border:0;padding:5px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .th-eye svg{width:22px;height:22px}
  .th-eye.locked{color:var(--line-strong);cursor:default}
  .th-eye.offered::after{content:'';position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:#c0392b;border:2px solid var(--bg)}
  .th-eye-wrap .tip{position:absolute;top:calc(100% + 9px);right:-4px;width:200px;background:var(--ink);color:var(--panel);font-size:12px;line-height:1.45;padding:10px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.24);opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .14s,transform .14s;z-index:30;text-align:left}
  body.dark .th-eye-wrap .tip{background:var(--panel);color:var(--ink);border:1px solid var(--line-strong)}
  .th-eye-wrap .tip::before{content:'';position:absolute;bottom:100%;right:12px;border:6px solid transparent;border-bottom-color:var(--ink)}
  body.dark .th-eye-wrap .tip::before{border-bottom-color:var(--panel)}
  .th-eye-wrap:hover .tip,.th-eye-wrap.tip-show .tip{opacity:1;transform:none}
  /* conversation "more" menu (unmatch / block) */
  .th-menu-wrap{position:relative;display:flex}
  .th-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:170px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:6px;display:none;z-index:40}
  .th-menu.open{display:block}
  .th-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:6px;font-size:15px;color:var(--ink)}
  .th-menu button:active{background:var(--fill)}
  .th-menu button.danger{color:#b23b3b}
  .msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45}
  .bubble.them{background:var(--fill);align-self:flex-start;border-bottom-left-radius:3px}
  .bubble.me{background:var(--ink);color:var(--panel);align-self:flex-end;border-bottom-right-radius:3px}
  body.dark .bubble.me{color:#1c1c1c}
  .composer{position:sticky;bottom:0;z-index:10;background:var(--bg);display:flex;gap:10px;border-top:1px solid var(--line);margin:auto -18px 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
  .composer .field{flex:1;height:46px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--panel);padding:0 14px;color:var(--ink);font-size:14px;font-family:inherit;outline:none}
  .composer .field::placeholder{color:var(--muted)}
  /* pinned ad preview at the top of a conversation */
  .ad-snip{background:var(--fill-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;cursor:pointer}
  .ad-snip .ad-name{font-size:calc(16px * var(--fscale,1));margin:0 0 2px}
  .ad-snip .ad-place{font-size:10px;margin:0 0 6px}
  .ad-snip .ad-headline{font-size:11px;margin:0 0 6px}
  .ad-snip p{font-size:12.5px;color:var(--muted);margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  /* inline face-reveal prompt in the conversation body (only once a mutual reveal is unlocked) */

  initPaperZoom();

function initPaperZoom(){
  const vp = document.getElementById('paperVp'), paper = document.getElementById('paper');
  const PAPER_W = 720;
  paper.style.width = PAPER_W + 'px';
  paper.style.transformOrigin = '0 0';
  const paperH = paper.offsetHeight;            // natural (unscaled) height
  let minScale = 0.5, maxScale = 2.2, scale = 0.5, panX = 0, panY = 0, userZoomed = false;
  const clampPan = ()=>{ const vpW = vp.clientWidth, vpH = vp.clientHeight, cw = PAPER_W*scale, ch = paperH*scale;
    panX = Math.min(Math.max(0, panX), Math.max(0, cw - vpW));
    panY = Math.min(Math.max(0, panY), Math.max(0, ch - vpH)); };
  const apply = ()=>{ clampPan(); paper.style.transform = `translate(${-panX}px,${-panY}px) scale(${scale})`; };
  const clamp = s => Math.max(minScale, Math.min(maxScale, s));
  // fit-to-width = fully zoomed out; keeps re-fitting until the user zooms/pans
  const START_ZOOM = 2.2;   // start slightly zoomed IN (min = fit-to-width) to invite panning
  const fit = ()=>{
    const vpW = vp.clientWidth; if(!vpW) return;
    minScale = vpW / PAPER_W; maxScale = Math.max(2.4, minScale * 4);
    if(!userZoomed){
      scale = Math.min(maxScale, minScale * START_ZOOM);
      panX = (PAPER_W*scale - vpW) / 2;   // centered horizontally
      panY = 0;                           // masthead at top
      apply();
    }
  };
  const zoomAt = (ns, cx, cy)=>{
    const r = vp.getBoundingClientRect(), oldS = scale;
    ns = clamp(ns); if(ns === oldS) return;
    userZoomed = true;
    const px = (cx - r.left + panX) / oldS, py = (cy - r.top + panY) / oldS;
    scale = ns; panX = px*scale - (cx - r.left); panY = py*scale - (cy - r.top); apply();
  };
  fit();
  if(window.ResizeObserver){ const ro = new ResizeObserver(fit); ro.observe(vp); }
  const pointers = new Map(); let panMoved = false, startDist = 0, startScale = 1;
  vp.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY}); panMoved = false;
    try{ vp.setPointerCapture(e.pointerId); }catch(_){}  // can throw NotFoundError; must not abort pointer bookkeeping
    if(pointers.size === 2){ const p = [...pointers.values()]; startDist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1; startScale = scale; }
  });
  vp.addEventListener('pointermove', e=>{
    const prev = pointers.get(e.pointerId); if(!prev) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size >= 2){
      const p = [...pointers.values()]; const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1;
      zoomAt(startScale * d/startDist, (p[0].x+p[1].x)/2, (p[0].y+p[1].y)/2); panMoved = true;
    } else {
      const dx = e.clientX-prev.x, dy = e.clientY-prev.y;
      if(Math.abs(dx)+Math.abs(dy) > 2){ panMoved = true; userZoomed = true; }
      panX -= dx; panY -= dy; apply();
    }
  });
  const up = e=>{
    const wasSingleTap = pointers.size === 1 && !panMoved;
    pointers.delete(e.pointerId);
    try{ vp.releasePointerCapture(e.pointerId); }catch(_){}
    // pointer capture steals the native click, so resolve taps ourselves
    if(wasSingleTap){
      const clip = (document.elementFromPoint(e.clientX, e.clientY) || {}).closest?.('.clip');
      if(clip) openAd(+clip.dataset.ad);
    }
  };
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); try{ vp.releasePointerCapture(e.pointerId); }catch(_){} });
  vp.addEventListener('wheel', e=>{
    e.preventDefault();
    if(e.ctrlKey) zoomAt(scale * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX, e.clientY);
    else { userZoomed = true; panX += e.deltaX; panY += e.deltaY; apply(); }
  }, {passive:false});
  const zoomCenter = f => { const r = vp.getBoundingClientRect(); zoomAt(scale*f, r.left+vp.clientWidth/2, r.top+vp.clientHeight/2); };
  document.getElementById('paperZoomIn').onclick  = ()=>zoomCenter(1.4);
  document.getElementById('paperZoomOut').onclick = ()=>zoomCenter(1/1.4);
}

// shared checkbox/radio wiring for any container
function wireChecks(container){
  container.querySelectorAll('.check:not(.writein-check)').forEach(c=>c.addEventListener('click',()=>{
    const group = c.dataset.group;
    const siblings = container.querySelectorAll(`.check[data-group="${group}"]`);
    if(c.classList.contains('radio')){
      siblings.forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
    } else if(c.dataset.exclusive){
      const willSelect = !c.classList.contains('sel');
      siblings.forEach(x=>x.classList.remove('sel'));
      c.classList.toggle('sel', willSelect);
    } else {
      c.classList.toggle('sel');
      siblings.forEach(x=>{ if(x.dataset.exclusive) x.classList.remove('sel'); });
    }
    container.querySelectorAll(`.writein-check[data-group="${group}"]`).forEach(wc=>{
      if(!wc.classList.contains('sel')) wc.querySelector('.writein-field').value = '';
    });
  }));
  container.querySelectorAll('.writein-check').forEach(wc=>{
    const input = wc.querySelector('.writein-field');
    const group = wc.dataset.group;
    const activate = ()=>{
      const hasText = input.value.trim().length > 0;
      wc.classList.toggle('sel', hasText);
      if(hasText){
        if(wc.classList.contains('radio')){
          container.querySelectorAll(`.check[data-group="${group}"]`).forEach(x=>{ if(x!==wc) x.classList.remove('sel'); });
        } else {
          container.querySelectorAll(`.check[data-group="${group}"][data-exclusive]`).forEach(x=>x.classList.remove('sel'));
        }
      }
    };
    const bx = wc.querySelector('.bx');
    input.addEventListener('input', activate);
    input.addEventListener('focus', ()=>{ if(input.value.trim().length > 0) activate(); });
    bx.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(input.value.trim().length > 0){ input.value = ''; wc.classList.remove('sel'); }
      else input.focus();
    });
    wc.addEventListener('click', (e)=>{ if(e.target === wc) input.focus(); });
  });
}

    <div class="reveal-status">✓ ${a.name} is ready to show their face</div>
    <button class="btn block" id="readyBtn">I'm ready to show my face</button>`;
  overlay.classList.add('open', 'card-modal');

function faceRevealStep(a){
  // both sides have now traded faces — clear any pending offer/defer + refresh the header eye state
  revealedAdIds.add(a.id);
  revealOffered.delete(a.id); revealDeferred.delete(a.id);
  if(state.view === 'thread' && state.threadAd === a.id) renderThread();
  sheet.innerHTML = `
    <button class="close" id="closeSheet">×</button>
    <h3>You both said yes</h3>
    <p>Press and hold ${a.name}'s photo to reveal it — lift your finger and it fogs back over.</p>
    <div class="reveal-single">
      <div class="reveal-tile"><div class="portrait them"></div><div class="frost"></div><div class="reveal-cap">${a.name}</div></div>
    </div>
    <div class="reveal-hint">This photo isn't saved anywhere — it only exists in this moment.</div>`;
  document.getElementById('closeSheet').onclick = closeSheet;
  sheet.querySelectorAll('.reveal-tile').forEach(tile=>{
    const frost = tile.querySelector('.frost');
    let mx=0, my=0, radius=0, last=0; const MAXR=60;
    const apply = ()=>{
      if(radius<=0){ frost.style.webkitMaskImage='none'; frost.style.maskImage='none'; return; }
      const g = `radial-gradient(circle at ${mx}px ${my}px, transparent 0, transparent ${radius}px, #000 ${radius+40}px)`;
      frost.style.webkitMaskImage = g; frost.style.maskImage = g;
    };
    const at = (clientX, clientY)=>{ const r = tile.getBoundingClientRect(); mx = clientX-r.left; my = clientY-r.top; radius = MAXR; last = Date.now(); apply(); };
    // desktop: cursor-follow · mobile: press-and-hold
    tile.addEventListener('mousemove', e=>at(e.clientX, e.clientY));
    tile.addEventListener('mouseleave', ()=>{ radius = 0; apply(); });
    tile.addEventListener('touchstart', e=>{ const t=e.touches[0]; at(t.clientX, t.clientY); }, {passive:true});
    tile.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.touches[0]; at(t.clientX, t.clientY); }, {passive:false});
    const release = ()=>{ radius = 0; apply(); };
    tile.addEventListener('touchend', release);
    tile.addEventListener('touchcancel', release);
    // fog back over when the touch/cursor stops moving
    const iv = setInterval(()=>{
      if(!document.body.contains(tile)){ clearInterval(iv); return; }
      if(Date.now()-last > 260 && radius > 0){ radius -= 5; if(radius<0) radius = 0; apply(); }
    }, 45);
  });
}

// ---------- Conversation thread ----------
function openThread(adId){ const c = CONVOS.find(x=>x.adId===adId); if(c) c.unread=false; state.threadAd = adId; setView('thread'); }
const THREADS = {};
const FACE_UNLOCK = 5;
const REPLIES = [
  "Ha, okay — that's a good answer.",
  "Tell me more about that.",
  "See, now I'm curious.",
  "Honestly? Same.",
  "That made me smile.",
  "Okay, you're winning me over.",
  "Noted — what else?",
];
function threadMsgs(a){
  if(!THREADS[a.id]){
    const convo = CONVOS.find(c=>c.adId===a.id);
    THREADS[a.id] = convo ? [
      {who:'me', text:`Hi ${a.name} — your ad made me smile. "${a.headline}" is a great line.`},
      {who:'them', text:"Thank you! That's a nicer opener than most. What are you into?"},
      {who: convo.mine ? 'me' : 'them', text: convo.last},
    ] : [];
  }
  return THREADS[a.id];
}
// conversation-header icons
const IC_BACK  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 6 5 12 11 18"/></svg>`;
const IC_EYE   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg>`;
const IC_MORE  = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>`;
// inline face-reveal prompt shown in the conversation body once a reveal is unlocked
function revealInlineHTML(a, s){
  if(s.revealed){
    return `<div class="reveal-inline done">
      <svg class="ri-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
      <div class="ri-text">You and ${a.name} have traded faces.</div>
      <button class="ri-link" id="reFaceBtn">See again</button>
    </div>`;
  }
  // Once they've offered (dot on the eye) or you've said "let's wait", the chat prompt goes away.
  if(s.unlocked && !s.theyOffered && !s.deferred){
    return `<div class="reveal-inline">
      <div class="ri-text">You've been talking a while — ready to see each other?</div>
      <button class="btn sm" id="revealFaceBtn">Reveal faces</button>
      <button class="ri-link" id="waitFaceBtn">Let's wait until we meet</button>
    </div>`;
  }
  return '';  // locked / offered / deferred: nothing in the chat body
}
function renderThread(){
  const a = ADS.find(x=>x.id===state.threadAd);
  const msgs = threadMsgs(a);
  const mine = msgs.filter(m=>m.who==='me').length;
  const theirs = msgs.filter(m=>m.who==='them').length;
  const unlocked = mine >= FACE_UNLOCK && theirs >= FACE_UNLOCK;
  const revealed = revealedAdIds.has(a.id);
  const theyOffered = unlocked && !revealed && revealOffered.has(a.id);
  const deferred = revealDeferred.has(a.id);
  const eyeCls = revealed ? 'th-eye' : unlocked ? ('th-eye' + (theyOffered ? ' offered' : '')) : 'th-eye locked';
  const eyeTip = revealed ? `You and ${a.name} have traded faces — tap to see again.`
    : theyOffered ? `${a.name} showed you their face — tap to reveal yours.`
    : unlocked ? `You've been talking a while — tap to reveal faces to each other.`
    : `Keep the conversation going to unlock a mutual face reveal.`;
  scroll.classList.add('thread-mode');
  scroll.innerHTML = `
    <div class="thread">
      <div class="thread-head">
        <button class="th-icon" id="back" aria-label="Back to messages">${IC_BACK}</button>
        <button class="th-name" id="threadName" style="${hstyle(a.headingFont)}" title="View ${a.name}'s ad">${a.name}</button>
        <div class="th-actions">
          <span class="th-eye-wrap">
            <button class="${eyeCls}" id="eyeBtn" aria-label="Face reveal">${IC_EYE}</button>
            <span class="tip">${eyeTip}</span>
          </span>
          <div class="th-menu-wrap">
            <button class="th-icon" id="moreBtn" aria-label="More options">${IC_MORE}</button>
            <div class="th-menu" id="threadMenu">
              <button id="unmatchBtn">Unmatch</button>
              <button class="danger" id="blockBtn">Block / Report</button>
            </div>
          </div>
        </div>
      </div>
      <div class="ad-snip" id="adSnip" title="View full ad">
        <div class="ad-name" style="${hstyle(a.headingFont)}">${a.name}, ${a.age}</div>
        <div class="ad-place">${a.location}</div>
        <div class="ad-headline" style="font-family:${cssFor(a.bodyFont)}">${a.headline}</div>
        <p style="font-family:${cssFor(a.bodyFont)}">${a.desc}</p>
      </div>
      <div class="msgs">
        ${msgs.length ? msgs.map(m=>`<div class="bubble ${m.who}">${m.text}</div>`).join('')
          : `<div class="bubble them" style="background:transparent;color:var(--muted);font-style:italic">Start the conversation.</div>`}
        ${msgs.length ? revealInlineHTML(a, {unlocked, revealed, theyOffered, deferred}) : ''}
      </div>
      <div class="composer">
        <input class="field" id="composerInput" placeholder="Write a message…">
        <button class="btn" id="sendBtn" disabled>Send</button>
      </div>
    </div>`;
  document.getElementById('back').onclick = ()=>setView('messages');
  document.getElementById('threadName').onclick = ()=>openAd(a.id, false);
  document.getElementById('adSnip').onclick = ()=>openAd(a.id, false);
  const moreBtn = document.getElementById('moreBtn'), threadMenu = document.getElementById('threadMenu');
  moreBtn.onclick = (e)=>{
    e.stopPropagation();
    const willOpen = !threadMenu.classList.contains('open');
    threadMenu.classList.toggle('open', willOpen);
    if(willOpen){
      const close = (ev)=>{ if(!threadMenu.contains(ev.target) && ev.target!==moreBtn){ threadMenu.classList.remove('open'); document.removeEventListener('click', close); } };
      setTimeout(()=>document.addEventListener('click', close), 0);
    }
  };
  document.getElementById('unmatchBtn').onclick = ()=>{ threadMenu.classList.remove('open'); openUnmatchConfirm(a.id); };
  document.getElementById('blockBtn').onclick = ()=>{ threadMenu.classList.remove('open'); openBlockConfirm(a.id); };
  const rf = document.getElementById('revealFaceBtn'); if(rf) rf.onclick = ()=>openFaceReveal(a.id);
  const ra = document.getElementById('reFaceBtn'); if(ra) ra.onclick = ()=>{ overlay.classList.add('open','card-modal'); faceRevealStep(a); };
  const wf = document.getElementById('waitFaceBtn'); if(wf) wf.onclick = ()=>{
    revealDeferred.add(a.id); renderThread();
    // (prototype) simulate the other person choosing to show their face a moment later → dot on the eye
    setTimeout(()=>{ if(state.view==='thread' && state.threadAd===a.id && !revealedAdIds.has(a.id)){ revealOffered.add(a.id); renderThread(); } }, 2200);
  };
  const eye = document.getElementById('eyeBtn'), eyeWrap = eye.closest('.th-eye-wrap');
  eye.onclick = ()=>{
    if(revealed){ overlay.classList.add('open','card-modal'); faceRevealStep(a); }
    else if(unlocked){ openFaceReveal(a.id); }
    else {  // locked: surface the tooltip (tap on mobile; hover already shows it on desktop)
      eyeWrap.classList.add('tip-show');
      clearTimeout(eyeWrap._tipT);
      eyeWrap._tipT = setTimeout(()=>eyeWrap.classList.remove('tip-show'), 2800);
    }
  };
  const ci = document.getElementById('composerInput'), sb = document.getElementById('sendBtn');
  ci.addEventListener('input', ()=>{ sb.disabled = ci.value.trim().length === 0; });
  const send = ()=>{
    const t = ci.value.trim(); if(!t) return;
    msgs.push({who:'me', text:t});
    renderThread();
    scroll.scrollTop = scroll.scrollHeight;
    setTimeout(()=>{
      if(state.view!=='thread' || state.threadAd!==a.id) return;
      msgs.push({who:'them', text: REPLIES[theirs % REPLIES.length]});
      renderThread();
      scroll.scrollTop = scroll.scrollHeight;
    }, 650);
  };
  sb.addEventListener('click', send);
  ci.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
}

// collapsible field row (emptyText = summary shown when nothing is entered)
function accField(label, bodyHtml, group, emptyText){
  emptyText = emptyText || 'None selected';
  return `<div class="acc" data-acc data-acc-group="${group}" data-acc-empty="${emptyText}"><button type="button" class="acc-head"><span class="acc-label">${label}</span><span class="acc-value" data-acc-value>${emptyText}</span><span class="acc-chev">▾</span></button><div class="acc-body" hidden>${bodyHtml}</div></div>`;
}
// free-text accordion body (e.g. Appearance): "Describe yourself" + a 50-char counter
function appearanceBody(value){
  value = value || '';
  return `<div class="lab-row" style="margin-bottom:8px"><label class="lab">Describe yourself</label><span class="counter" data-acc-counter>${value.length}/50</span></div>
    <textarea class="acc-text-field" data-acc-text maxlength="50" placeholder="ex. tall, glasses, goth">${value}</textarea>`;
}
// read a free-text accordion's value out of a container
function accText(container, group){
  const t = container.querySelector(`[data-acc][data-acc-group="${group}"] [data-acc-text]`);
  return t ? t.value.trim() : '';
}
function updateAccSummary(container, group){
  const acc = container.querySelector(`[data-acc][data-acc-group="${group}"]`);
  if(!acc) return;
  const valEl = acc.querySelector('[data-acc-value]');
  const empty = acc.dataset.accEmpty || 'None selected';
  // free-text field (e.g. Appearance) — summary is the typed text
  const txt = acc.querySelector('[data-acc-text]');
  if(txt){
    const v = txt.value.trim();
    valEl.textContent = v || empty;
    valEl.classList.toggle('set', v.length>0);
    return;
  }
  const sel = [...acc.querySelectorAll('.check.sel:not(.writein-check)')].map(c=>c.dataset.val);
  const wf = acc.querySelector('.writein-check.sel .writein-field');
  if(wf && wf.value.trim()) sel.push(wf.value.trim());
  valEl.textContent = sel.length ? sel.join(', ') : empty;
  valEl.classList.toggle('set', sel.length>0);
}
function wireAccordions(container){
  container.querySelectorAll('[data-acc]').forEach(acc=>{
    const body = acc.querySelector('.acc-body');
    acc.querySelector('.acc-head').addEventListener('click', ()=>{ body.hidden = !acc.classList.toggle('open'); });
  });
  // live counter for free-text accordion bodies (Appearance)
  container.querySelectorAll('[data-acc-text]').forEach(t=>{
    const cnt = t.parentElement.querySelector('[data-acc-counter]');
    const max = +t.getAttribute('maxlength') || 50;
    const upd = ()=>{ if(cnt){ cnt.textContent = `${t.value.length}/${max}`; cnt.classList.toggle('at-max', t.value.length>=max); } };
    t.addEventListener('input', upd); upd();
  });
  const refresh = ()=>container.querySelectorAll('[data-acc]').forEach(acc=>updateAccSummary(container, acc.dataset.accGroup));
  refresh();
  container.addEventListener('click', (e)=>{
    refresh();
    const chk = e.target.closest('.check.radio:not(.writein-check)');
    if(chk){ const acc = chk.closest('[data-acc]'); if(acc){ acc.classList.remove('open'); acc.querySelector('.acc-body').hidden = true; } }
  });
  container.addEventListener('input', refresh);
}

  } else if(obStep===4){
    body.innerHTML = `<div class="ob-step"><div class="ob-kicker">Step 4 of 4</div><h2>Add your photo <span class="req-mark">*</span></h2>
      <p class="ob-sub">No one sees this on your ad. It stays hidden until you and someone both choose to trade faces.</p>
      <input type="file" accept="image/*" id="photoInput" hidden>
      <div id="photoSlot">${photoSlotHtml()}</div>
      <div class="photo-privacy">🔒 Hidden until a mutual face reveal — never shown on your public ad.</div></div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><button class="btn" id="obNext">Next</button>`;
  } else if(obStep===5){
    body.innerHTML = `<div class="ob-step"><div class="ob-kicker">Review</div><h2>Here's your personal</h2>
      <p class="ob-sub">Your whole ad in one place. Confirm when it looks right — you can refine it anytime in My Ad.</p>
      ${obAdCard()}
      ${obPhotoNote()}</div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><button class="btn" id="obNext">Confirm</button>`;
  } else {
    body.innerHTML = `<div class="ob-step"><div class="ob-kicker">Optional</div><h2>Make it yours</h2>
      <p class="ob-sub">Give your headline and text a font that fits your vibe — or skip it and change it anytime in My Ad.</p>
      <div id="obCustPreview">${obAdCard()}</div>
      <div class="cust-drops">
        <label class="drop"><span class="drop-label">Name font</span>
          <select class="drop-select" id="obHeadSel" style="font-family:${cssFor(obData.headingFont)}">
            ${HEADING_FONTS.map(f=>`<option value="${f.name}" style="font-family:${f.css}"${f.name===obData.headingFont?' selected':''}>${f.name} · ${f.vibe}</option>`).join('')}
          </select></label>
        <label class="drop"><span class="drop-label">Body font</span>
          <select class="drop-select" id="obBodySel" style="font-family:${cssFor(obData.bodyFont)}">
            ${BODY_FONTS.map(f=>`<option value="${f.name}" style="font-family:${f.css}"${f.name===obData.bodyFont?' selected':''}>${f.name}</option>`).join('')}
          </select></label>
      </div></div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><div style="display:flex;gap:10px;flex:1"><button class="btn ghost" id="obLater" style="flex:1">Later</button><button class="btn" id="obPost" style="flex:1">Post my ad</button></div>`;
  }
  const next=document.getElementById('obNext'), back=document.getElementById('obBack'), post=document.getElementById('obPost');
  if(next) next.onclick=()=>{ obSaveStep(); obStep++; renderOnboarding(); };
  if(back) back.onclick=()=>{ obSaveStep(); obStep--; renderOnboarding(); };
  if(post) post.onclick=()=>{ obSaveStep(); finishOnboarding(); };
  const later=document.getElementById('obLater');
  if(later) later.onclick=()=>{ finishOnboarding(); };
  const obHeadSel=document.getElementById('obHeadSel'), obBodySel=document.getElementById('obBodySel'), obPv=document.getElementById('obCustPreview');
  if(obHeadSel) obHeadSel.addEventListener('change', ()=>{ obData.headingFont=obHeadSel.value; obHeadSel.style.fontFamily=cssFor(obData.headingFont); if(obPv) obPv.innerHTML=obAdCard(); });
  if(obBodySel) obBodySel.addEventListener('change', ()=>{ obData.bodyFont=obBodySel.value; obBodySel.style.fontFamily=cssFor(obData.bodyFont); if(obPv) obPv.innerHTML=obAdCard(); });
  const bindCnt=(id,cntId,max)=>{ const el=document.getElementById(id),cnt=document.getElementById(cntId); if(!el||!cnt)return; const u=()=>{cnt.textContent=`${el.value.length}/${max}`;cnt.classList.toggle('at-max',el.value.length>=max);}; el.addEventListener('input',u); u(); };
  bindCnt('obHead','obHeadCnt',250); bindCnt('obDesc','obDescCnt',1000);
  const desc=document.getElementById('obDesc');
  if(desc){ const grow=()=>{desc.style.height='auto';desc.style.height=desc.scrollHeight+'px';}; desc.addEventListener('input',grow); grow(); }
  ['obName','obAge','obLoc','obHead','obDesc'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', obValidate); });
  const photoInput=document.getElementById('photoInput');
  if(photoInput){ photoInput.onchange=()=>{ const f=photoInput.files&&photoInput.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=e=>{ obData.photo=e.target.result; const slot=document.getElementById('photoSlot'); if(slot) slot.innerHTML=photoSlotHtml(); rebindPhoto(); obValidate(); }; rd.readAsDataURL(f); }; }
  rebindPhoto();
  if(obStep===3){
    const stepEl = body.querySelector('.ob-step');
    if(stepEl){
      wireChecks(stepEl);
      stepEl.querySelectorAll('[data-toggle]').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('on')));
      wireAccordions(stepEl);
      stepEl.addEventListener('click', obValidate);
      stepEl.addEventListener('input', obValidate);
    }
  }
  obValidate();
}

// ---------- boot ----------
let feedResizeTimer;
window.addEventListener('resize', ()=>{
  if(state.view!=='feed' || feedView!=='paper') return;
  clearTimeout(feedResizeTimer);
  feedResizeTimer = setTimeout(renderFeed, 150);
});
issueEl.textContent = TODAY_STR;
updateMsgBadge();
setView('feed');
</script>
</body>
