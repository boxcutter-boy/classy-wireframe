<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Classy — Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Instrument+Sans:ital@0;1&family=Instrument+Serif:ital@0;1&family=Jacquard+24&family=Monoton&family=Rubik+Dirt&family=Ruthie&family=Sancreek&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f4;
    --panel:#ffffff;
    --rail:#3a3a3a;
    --rail-ink:#f4f4f4;
    --rail-muted:#a9a9a9;
    --line:#c9c9c9;
    --line-strong:#8f8f8f;
    --fill:#ececec;
    --fill-2:#f7f7f7;
    --ink:#1f1f1f;
    --muted:#828282;
    --radius:6px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    /* printed-paper palette for the newspaper feed view */
    --news-bg:#fcfcf8; --news-ink:#161616; --news-muted:#6d6d66; --news-rule:#bcbcb2;
  }
  body.dark{
    --bg:#242424; --panel:#2e2e2e; --rail:#1c1c1c; --rail-ink:#e8e8e8; --rail-muted:#8a8a8a;
    --line:#484848; --line-strong:#6a6a6a; --fill:#3a3a3a; --fill-2:#333; --ink:#e8e8e8; --muted:#9a9a9a;
    --news-bg:#262624; --news-ink:#e9e9e4; --news-muted:#a7a79f; --news-rule:#4c4c48;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);display:flex;overflow:hidden}
  button{font-family:inherit;cursor:pointer}

  /* ---------- Sidebar ---------- */
  .rail{
    width:220px;flex:0 0 220px;background:var(--rail);color:var(--rail-ink);
    height:100vh;display:flex;flex-direction:column;padding:22px 16px;
  }
  .brand{font-family:var(--serif);font-size:32px;line-height:1;letter-spacing:.01em}
  .tag{font-size:10px;letter-spacing:.22em;color:var(--rail-muted);margin-top:8px;text-transform:uppercase}
  .nav{margin-top:34px;display:flex;flex-direction:column;gap:4px}
  .nav button{
    display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--rail-ink);
    padding:10px 10px;border-radius:6px;font-size:14px;text-align:left;width:100%;opacity:.82;
  }
  .nav button:hover{background:rgba(255,255,255,.06);opacity:1}
  .nav button.active{opacity:1;font-weight:700}
  .nav button svg{width:19px;height:19px;flex:0 0 auto;opacity:.92}
  .rail .foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}
  .rail .acct{font-size:13px;margin-bottom:12px}
  .rail .acct b{font-weight:700}
  .rail .acct span{color:var(--rail-muted)}
  .rail .foot-row{display:flex;align-items:center;justify-content:space-between}
  .rail .foot-row button{background:none;border:0;color:var(--rail-ink);opacity:.82;display:flex;align-items:center;gap:8px;font-size:13px;padding:4px}
  .rail .foot-row button:hover{opacity:1}
  .rail .foot-row button svg{width:18px;height:18px;flex:0 0 auto}

  /* ---------- Main ---------- */
  .main{position:relative;flex:1;height:100vh;display:flex;flex-direction:column;min-width:0}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 34px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--bg);
  }
  .topbar h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0}
  .topbar .date{display:inline-flex;align-items:baseline;gap:9px;color:var(--muted)}
  .topbar .date .date-label{font-family:var(--font);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  .topbar .date .date-val{font-family:var(--serif);font-size:22px;font-style:italic}
  .topbar-right{display:flex;align-items:center;gap:22px}
  /* feed view toggle: masonry ⇄ newspaper (only visible on the feed) */
  /* floats over the top-left of the feed content, fixed while the paper pans */
  .viewseg{position:absolute;top:86px;left:30px;z-index:25;display:none;align-items:center;
    border:1.5px solid var(--line-strong);border-radius:7px;overflow:hidden;background:var(--panel);
    box-shadow:0 2px 12px rgba(0,0,0,.1)}
  .viewseg.show{display:inline-flex}
  .viewseg button{display:flex;align-items:center;justify-content:center;background:var(--panel);border:0;color:var(--muted);padding:8px 14px}
  .viewseg button + button{border-left:1.5px solid var(--line-strong)}
  .viewseg button:hover{color:var(--ink)}
  .viewseg button.active{background:var(--ink);color:var(--panel)}
  .viewseg button svg{width:19px;height:19px;display:block}
  .scroll{flex:1;overflow-y:auto;padding:30px 34px 60px}

  /* ---------- Feed ---------- */
  .horoscope{text-align:center;max-width:640px;margin:0 auto 28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .horo-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .horo-text{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.55;color:var(--ink);margin:8px 0 0}
  .masonry{display:flex;gap:20px;align-items:flex-start}
  .mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
  .card{
    background:var(--panel);border:1.5px solid var(--line-strong);border-radius:var(--radius);
    padding:18px;text-align:left;display:block;width:100%;margin:0;cursor:pointer;
    transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;
  }
  .card:hover{border-color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.09);transform:translateY(-2px)}
  .card p{font-size:13px;line-height:1.5;color:var(--ink);margin:0}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tag-chip{font-size:11px;padding:4px 9px;background:var(--fill);border:1px solid var(--line);border-radius:4px;color:var(--muted)}
  /* ad typography (global): decorative font on name+age only; headline ALWAYS ALL CAPS in the body font */
  .ad-name{font-weight:500;font-size:calc(22px * var(--fscale,1));line-height:1.05;color:var(--ink);margin:0 0 6px}
  .ad-place{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .ad-headline{font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;line-height:1.3;color:var(--ink);margin:0 0 11px}
  .ad-body{font-size:13px;line-height:1.5;color:var(--ink);margin:0}
  .sheet .ad-name,.myad-card .ad-name{font-size:calc(27px * var(--fscale,1))}
  /* ad you've already replied to — still shown (daily limit), but de-emphasized */
  .card.replied{background:var(--fill-2)}
  .card.replied .ad-name,.card.replied .ad-headline,.card.replied .ad-body,.card.replied .tags{opacity:.45}
  .card.replied:hover{border-color:var(--line-strong);box-shadow:0 2px 8px rgba(0,0,0,.05);transform:none}
  .replied-note{display:flex;align-items:center;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--muted)}
  .replied-note::before{content:'✓';display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:10px;flex:none}
  /* gated feed (no ad posted) */
  .feed-locked{position:relative;overflow:hidden;max-height:560px}
  .feed-locked .masonry .card{pointer-events:none}
  .feed-blur{position:absolute;left:-12px;right:-12px;bottom:0;height:66%;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);background:linear-gradient(to bottom, rgba(0,0,0,0), var(--bg) 80%)}
  .feed-gate{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;z-index:2;padding:0 20px}
  .feed-gate-card{background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;padding:26px 28px;max-width:420px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.14)}
  .feed-gate-card h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 10px}
  .feed-gate-card p{font-size:14px;color:var(--muted);line-height:1.55;margin:0 0 18px}

  /* ---------- Feed: The Newspaper (fixed sheet you pan & zoom around) ---------- */
  .scroll.paper-mode{padding:0;overflow:hidden;position:relative}
  .paper-viewport{position:absolute;inset:0;overflow:hidden;background:var(--news-bg);cursor:grab;
    user-select:none;-webkit-user-select:none}
  .paper-viewport.panning{cursor:grabbing}
  .paper{width:1120px;transform-origin:0 0;background:var(--news-bg);color:var(--news-ink);
    padding:40px 48px 44px;font-family:var(--serif);will-change:transform;box-shadow:0 8px 40px rgba(0,0,0,.16)}
  /* gated (no ad posted): a static, blurred snapshot of the sheet behind the post-your-ad gate */
  .paper.static{transform:scale(.62);transform-origin:top left;pointer-events:none;box-shadow:none;margin:0 auto}
  .masthead{text-align:center;border-bottom:3px double var(--news-ink);padding-bottom:16px;margin-bottom:24px}
  .mast-title{font-family:var(--serif);font-weight:700;font-size:76px;line-height:.9;letter-spacing:-.01em}
  .mast-sub{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--news-muted);
    margin-top:13px;border-top:1px solid var(--news-rule);padding-top:10px}
  .paper-cols{column-count:4;column-gap:34px;column-rule:1px solid var(--news-rule)}
  .clip{display:block;width:100%;text-align:left;background:none;border:0;padding:0 0 15px;margin:0 0 15px;
    border-bottom:1px solid var(--news-rule);break-inside:avoid;cursor:pointer;color:inherit;font-family:inherit;transition:opacity .12s}
  .clip:hover{opacity:.55}
  .clip-name{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:500;
    font-size:calc(20px * var(--fscale,1));line-height:1.05;color:var(--news-ink)}
  .clip-rep-ic{width:13px;height:13px;flex:0 0 auto;color:var(--news-ink);align-self:center}
  .clip-head{font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.22;margin:6px 0 5px;color:var(--news-ink)}
  .clip-body{font-size:12px;line-height:1.48;color:var(--news-ink);opacity:.9}
  .clip-loc{font-size:10.5px;font-style:italic;color:var(--news-muted);margin-top:6px}
  .clip.replied,.clip.replied:hover{opacity:.5}
  .paper-foot{text-align:center;font-size:13px;letter-spacing:.24em;color:var(--news-muted);margin-top:24px;font-family:var(--font)}
  /* zoom controls + hint float over the viewport */
  .paper-zoom{position:absolute;right:20px;bottom:22px;z-index:5;display:flex;flex-direction:column;gap:8px}
  .paper-zoom button{width:38px;height:38px;border:1.5px solid var(--line-strong);border-radius:9px;
    background:var(--panel);color:var(--ink);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .paper-zoom button:hover{border-color:var(--ink)}
  .paper-hint{position:absolute;left:20px;bottom:26px;z-index:5;font-size:12px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);pointer-events:none}

  /* ---------- Overlay ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:30px;z-index:50}
  .overlay.open{display:flex}
  .sheet{background:var(--panel);border:1.5px solid var(--line-strong);border-radius:8px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:30px}
  .sheet .close{float:right;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:5px;width:30px;height:30px;font-size:16px}
  .sheet .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .sheet h3{font-family:var(--serif);font-weight:500;font-size:calc(26px * var(--fscale,1));margin:8px 0 16px}
  .sheet p{font-size:14px;line-height:1.6;margin:0 0 18px}
  .sheet .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;border-top:1px solid var(--line);padding-top:16px;margin-bottom:20px}
  .sheet .meta div{font-size:13px}
  .sheet .meta span{color:var(--muted)}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:6px;font-size:14px;border:1.5px solid var(--ink);background:var(--ink);color:var(--panel)}
  body.dark .btn{color:#1c1c1c;background:var(--ink);border-color:var(--ink)}
  .btn.ghost{background:var(--panel);color:var(--ink)}
  .btn.block{width:100%}
  .btn:disabled{background:var(--fill);color:var(--muted);border-color:var(--line-strong);cursor:default}

  /* ---------- Messages list ---------- */
  .mlist{display:flex;flex-direction:column;gap:14px;max-width:760px}
  .mrow{background:var(--panel);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:18px;text-align:left;display:flex;gap:16px;align-items:flex-start;color:var(--ink)}
  .mrow:hover{border-color:var(--ink)}
  .mrow .kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .mrow h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:5px 0 8px}
  .mrow p{font-size:13px;line-height:1.5;color:var(--muted);margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mrow .when{font-size:12px;color:var(--muted);white-space:nowrap}

  /* ---------- Thread ---------- */
  .thread{max-width:720px;margin:0 auto;display:flex;flex-direction:column;height:100%}
  .back{background:none;border:0;color:var(--muted);font-size:13px;padding:0 0 14px;display:flex;gap:6px;align-items:center}
  .scroll.thread-mode{padding-top:0;padding-bottom:0}
  .thread-head{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:12px;margin:0 0 20px;padding:18px 0 14px;border-bottom:1px solid var(--line-strong)}
  .th-icon{background:none;border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:5px;flex:0 0 auto;border-radius:6px}
  .th-icon svg{width:22px;height:22px}
  .th-icon:hover{background:var(--fill)}
  .th-name{background:none;border:0;color:var(--ink);font-family:var(--serif);font-weight:500;font-size:calc(23px * var(--fscale,1));line-height:1.05;padding:2px 2px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .th-name:hover{text-decoration:underline;text-underline-offset:3px}
  .th-actions{margin-left:auto;display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .th-block{color:var(--muted)}
  .th-block:hover{color:#b23b3b;background:none}
  /* face-reveal eye + tooltip (greyed until a mutual reveal is unlocked) */
  .th-eye-wrap{position:relative;display:flex}
  .th-eye{position:relative;background:none;border:0;padding:5px;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:6px}
  .th-eye svg{width:22px;height:22px}
  .th-eye:hover{background:var(--fill)}
  .th-eye.locked{color:var(--line-strong);cursor:default}
  .th-eye.locked:hover{background:none}
  .th-eye.offered::after{content:'';position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:#c0392b;border:2px solid var(--bg)}
  .th-eye-wrap .tip{position:absolute;top:calc(100% + 9px);right:-4px;width:212px;background:var(--ink);color:var(--panel);font-size:12px;line-height:1.45;padding:10px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.24);opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .14s,transform .14s;z-index:30;text-align:left}
  body.dark .th-eye-wrap .tip{background:var(--panel);color:var(--ink);border:1px solid var(--line-strong)}
  .th-eye-wrap .tip::before{content:'';position:absolute;bottom:100%;right:12px;border:6px solid transparent;border-bottom-color:var(--ink)}
  body.dark .th-eye-wrap .tip::before{border-bottom-color:var(--panel)}
  .th-eye-wrap:hover .tip,.th-eye-wrap.tip-show .tip{opacity:1;transform:none}
  /* conversation "more" menu (unmatch / block) */
  .th-menu-wrap{position:relative;display:flex}
  .th-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:168px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:6px;display:none;z-index:40}
  .th-menu.open{display:block}
  .th-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;font-size:14px;color:var(--ink);cursor:pointer}
  .th-menu button:hover{background:var(--fill)}
  .th-menu button.danger{color:#b23b3b}
  /* pinned ad preview + inline face-reveal prompt in a conversation */
  .ad-snip{background:var(--fill-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;cursor:pointer}
  .ad-snip:hover{border-color:var(--line-strong)}
  .ad-snip .ad-name{font-size:calc(16px * var(--fscale,1));margin:0 0 3px}
  .ad-snip .ad-place{font-size:10px;margin:0 0 7px}
  .ad-snip .ad-headline{font-size:11px;margin:0 0 6px}
  .ad-snip p{font-size:12px;color:var(--muted);margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .reveal-inline{align-self:center;max-width:360px;margin:12px auto 4px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--fill-2);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .reveal-inline .ri-text{font-size:13px;color:var(--muted);line-height:1.5}
  .reveal-inline .ri-link{background:none;border:0;color:var(--ink);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:2px;cursor:pointer}
  .reveal-inline .ri-link:hover{opacity:.65}

  /* ---------- Face reveal ---------- */
  .reveal-status{font-size:13px;color:var(--ink);background:var(--fill-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:16px 0 18px;display:flex;align-items:center;gap:8px}
  .reveal-pair{display:flex;gap:16px;margin:18px 0 4px}
  .reveal-single{display:flex;justify-content:center;margin:18px 0 4px}
  .reveal-single .reveal-tile{flex:0 0 260px;width:260px}

  /* ---------- Onboarding ---------- */
  .onboarding{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;padding:30px}
  .onboarding.open{display:flex}
  .ob-card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:24px}
  .ob-body{overflow-y:auto;max-height:calc(100vh - 200px)}
  .ob-optional-head{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
  .ob-dots{display:flex;gap:7px;justify-content:center;min-height:8px}
  .ob-dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);opacity:.45}
  .ob-dot.on{opacity:1;background:var(--ink)}
  .ob-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .ob-body h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:0 0 8px}
  .ob-sub{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.5}
  .ob-step{display:flex;flex-direction:column;gap:16px}
  .ob-welcome{text-align:center;padding:16px 0}
  .ob-brand{font-family:var(--serif);font-size:52px;line-height:1}
  .ob-tag{font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:10px 0 30px}
  .ob-welcome h2{font-family:var(--serif);font-weight:500;font-size:28px;margin:0 0 10px}
  .ob-welcome p{font-size:15px;color:var(--muted);line-height:1.6;max-width:380px;margin:0 auto}
  .ob-nav{display:flex;justify-content:space-between;gap:12px}
  .ob-welcome-nav{display:flex;flex-direction:column;gap:14px;width:100%}
  .hiw-link{background:none;border:0;color:var(--muted);font-size:13px;font-family:inherit;letter-spacing:.02em;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px;align-self:center}
  .hiw-link:hover{color:var(--ink)}
  .hiw{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%;padding:6px 0 4px}
  .hiw-kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .hiw-illus{width:132px;height:132px;border-radius:14px;background:var(--fill);border:1.5px solid var(--line-strong);margin-bottom:26px}
  .hiw-h{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 12px}

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function ordinalSuffix(n){ const v = n % 100; if(v >= 11 && v <= 13) return 'th'; return ({1:'st',2:'nd',3:'rd'})[n % 10] || 'th'; }
const TODAY_STR = (()=>{ const d = new Date(); return `${MONTHS[d.getMonth()]} ${d.getDate()}${ordinalSuffix(d.getDate())}, ${d.getFullYear()}`; })();

  vp.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY}); panMoved = false; vp.classList.add('panning');
    try{ vp.setPointerCapture(e.pointerId); }catch(_){}
    if(pointers.size === 2){ const p = [...pointers.values()]; startDist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1; startScale = scale; }
  });
  vp.addEventListener('pointermove', e=>{
    const prev = pointers.get(e.pointerId); if(!prev) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size >= 2){
      const p = [...pointers.values()]; const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1;
      zoomAt(startScale * d/startDist, (p[0].x+p[1].x)/2, (p[0].y+p[1].y)/2); panMoved = true;
    } else {
      const dx = e.clientX-prev.x, dy = e.clientY-prev.y;
      if(Math.abs(dx)+Math.abs(dy) > 2){ panMoved = true; userAdjusted = true; }
      panX -= dx; panY -= dy; apply();
    }
  });
  const up = e=>{
    const wasClick = pointers.size === 1 && !panMoved;
    pointers.delete(e.pointerId);
    try{ vp.releasePointerCapture(e.pointerId); }catch(_){}
    if(pointers.size === 0) vp.classList.remove('panning');
    // pointer capture eats the native click, so resolve clip taps ourselves
    if(wasClick){
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const clip = el && el.closest ? el.closest('.clip') : null;
      if(clip) openAd(+clip.dataset.ad);
    }
  };
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); vp.classList.remove('panning'); try{ vp.releasePointerCapture(e.pointerId); }catch(_){} });
  vp.addEventListener('wheel', e=>{
    e.preventDefault();
    if(e.ctrlKey || e.metaKey) zoomAt(scale * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX, e.clientY);
    else { userAdjusted = true; panX += e.deltaX; panY += e.deltaY; apply(); }
  }, {passive:false});
  const zoomCenter = f => { const r = vp.getBoundingClientRect(); zoomAt(scale*f, r.left+vp.clientWidth/2, r.top+vp.clientHeight/2); };
  document.getElementById('paperZoomIn').onclick  = ()=>zoomCenter(1.3);
  document.getElementById('paperZoomOut').onclick = ()=>zoomCenter(1/1.3);
}

// shared checkbox/radio wiring for any container
function wireChecks(container){
  // standard option buttons (everything except the editable write-in)
  container.querySelectorAll('.check:not(.writein-check)').forEach(c=>c.addEventListener('click',()=>{
    const group = c.dataset.group;
    const siblings = container.querySelectorAll(`.check[data-group="${group}"]`);
    if(c.classList.contains('radio')){
      siblings.forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
    } else if(c.dataset.exclusive){
      // exclusive option (e.g. "Prefer not to say", "Everyone", "No preference") clears everything else
      const willSelect = !c.classList.contains('sel');
      siblings.forEach(x=>x.classList.remove('sel'));
      c.classList.toggle('sel', willSelect);
    } else {
      c.classList.toggle('sel');
      siblings.forEach(x=>{ if(x.dataset.exclusive) x.classList.remove('sel'); });
    }
    // any write-in that got deselected clears back to empty
    container.querySelectorAll(`.writein-check[data-group="${group}"]`).forEach(wc=>{
      if(!wc.classList.contains('sel')) wc.querySelector('.writein-field').value = '';
    });
  }));
  // write-in fields: presence of text is what selects them
  container.querySelectorAll('.writein-check').forEach(wc=>{
    const input = wc.querySelector('.writein-field');
    const group = wc.dataset.group;
    const activate = ()=>{
      const hasText = input.value.trim().length > 0;
      wc.classList.toggle('sel', hasText);
      if(hasText){
        if(wc.classList.contains('radio')){
          container.querySelectorAll(`.check[data-group="${group}"]`).forEach(x=>{ if(x!==wc) x.classList.remove('sel'); });
        } else {
          container.querySelectorAll(`.check[data-group="${group}"][data-exclusive]`).forEach(x=>x.classList.remove('sel'));
        }
      }
    };
    const bx = wc.querySelector('.bx');
    input.addEventListener('input', activate);
    input.addEventListener('focus', ()=>{ if(input.value.trim().length > 0) activate(); });
    // clicking the checkbox clears a filled write-in back to empty; focuses if empty
    bx.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(input.value.trim().length > 0){ input.value = ''; wc.classList.remove('sel'); }
      else input.focus();
    });
    // clicking the empty area of the box focuses the field
    wc.addEventListener('click', (e)=>{ if(e.target === wc) input.focus(); });
  });
}

function faceRevealStep(a){
  // record the mutual reveal so the thread header/prompt reflect it once the overlay closes
  revealedAdIds.add(a.id); revealOffered.delete(a.id); revealDeferred.delete(a.id);
  if(state.view === 'thread' && state.threadAd === a.id) renderThread();
  sheet.innerHTML = `

    </div>
    <div class="reveal-hint">This photo isn't saved anywhere — it only exists in this moment.</div>`;
  document.getElementById('closeSheet').onclick = closeAd;
  sheet.querySelectorAll('.reveal-tile').forEach(tile=>{
    const frost = tile.querySelector('.frost');
    let mx=0, my=0, radius=0, last=0; const MAXR=55;
    const apply = ()=>{
      if(radius<=0){ frost.style.webkitMaskImage='none'; frost.style.maskImage='none'; return; }
      const g = `radial-gradient(circle at ${mx}px ${my}px, transparent 0, transparent ${radius}px, #000 ${radius+40}px)`;
      frost.style.webkitMaskImage = g; frost.style.maskImage = g;
    };
    tile.addEventListener('mousemove', e=>{ const r = tile.getBoundingClientRect(); mx = e.clientX-r.left; my = e.clientY-r.top; radius = MAXR; last = Date.now(); apply(); });
    tile.addEventListener('mouseleave', ()=>{ radius = 0; apply(); });
    // fog back over when the cursor stops moving
    const iv = setInterval(()=>{
      if(!document.body.contains(tile)){ clearInterval(iv); return; }
      if(Date.now()-last > 300 && radius > 0){ radius -= 5; if(radius<0) radius = 0; apply(); }
    }, 45);
  });
}

const IC_MORE  = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>`;
const IC_LOCK  = `<svg class="ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>`;
function renderThread(){
  const a = ADS.find(x=>x.id===state.threadAd);
  const msgs = threadMsgs(a);
  const mine = msgs.filter(m=>m.who==='me').length;
  const theirs = msgs.filter(m=>m.who==='them').length;
  const unlocked = mine >= FACE_UNLOCK && theirs >= FACE_UNLOCK;
  const revealed = revealedAdIds.has(a.id);
  const theyOffered = unlocked && !revealed && revealOffered.has(a.id);
  const deferred = revealDeferred.has(a.id);
  const eyeCls = revealed ? 'th-eye' : unlocked ? ('th-eye' + (theyOffered ? ' offered' : '')) : 'th-eye locked';
  const eyeTip = revealed ? `You and ${a.name} have traded faces — click to see again.`
    : theyOffered ? `${a.name} showed you their face — click to reveal yours.`
    : unlocked ? `You've been talking a while — click to reveal faces to each other.`
    : `Keep the conversation going to unlock a mutual face reveal.`;
  const showPrompt = msgs.length && unlocked && !revealed && !theyOffered && !deferred;
  scroll.classList.add('thread-mode');
  scroll.innerHTML = `
    <div class="thread">
      <div class="thread-head">
        <button class="th-icon" id="back" aria-label="Back to messages">${IC_BACK}</button>
        <button class="th-name" id="threadName" style="${hstyle(a.headingFont)}" title="View ${a.name}'s ad">${a.name}</button>
        <div class="th-actions">
          <span class="th-eye-wrap">
            <button class="${eyeCls}" id="eyeBtn" aria-label="Face reveal">${IC_EYE}</button>
            <span class="tip">${eyeTip}</span>
          </span>
          <div class="th-menu-wrap">
            <button class="th-icon" id="moreBtn" aria-label="More options">${IC_MORE}</button>
            <div class="th-menu" id="threadMenu">
              <button id="unmatchBtn">Unmatch</button>
              <button class="danger" id="blockBtn">Block / Report</button>
            </div>
          </div>
        </div>
      </div>
      <div class="ad-snip" id="adSnip" title="View full ad">
        ${adNameHTML(a)}
        <div class="ad-place">${a.location}</div>
        ${adHeadlineHTML(a)}
        <p style="font-family:${cssFor(a.bodyFont)}">${a.desc}</p>
      </div>
      <div class="msgs">
        ${msgs.length ? msgs.map(m=>`<div class="bubble ${m.who}">${m.text}</div>`).join('')
          : `<div class="bubble them" style="background:transparent;color:var(--muted);font-style:italic">Start the conversation.</div>`}
        ${revealed ? `<div class="reveal-inline"><div class="ri-text">You and ${a.name} have traded faces.</div><button class="ri-link" id="reFaceBtn">See again</button></div>`
          : showPrompt ? `<div class="reveal-inline"><div class="ri-text">You've been talking a while — ready to see each other?</div><button class="btn sm" id="revealFaceBtn">Reveal faces</button><button class="ri-link" id="waitFaceBtn">Let's wait until we meet</button></div>` : ''}
      </div>
      <div class="composer">
        <input class="field" id="composerInput" placeholder="Write a message…">
        <button class="btn" id="sendBtn" disabled>Send</button>
      </div>
    </div>`;
  document.getElementById('back').onclick = ()=>setView('messages');
  document.getElementById('threadName').onclick = ()=>openAd(a.id, false);
  document.getElementById('adSnip').onclick = ()=>openAd(a.id, false);
  const moreBtn = document.getElementById('moreBtn'), threadMenu = document.getElementById('threadMenu');
  moreBtn.onclick = (e)=>{
    e.stopPropagation();
    const willOpen = !threadMenu.classList.contains('open');
    threadMenu.classList.toggle('open', willOpen);
    if(willOpen){
      const close = (ev)=>{ if(!threadMenu.contains(ev.target) && ev.target!==moreBtn){ threadMenu.classList.remove('open'); document.removeEventListener('click', close); } };
      setTimeout(()=>document.addEventListener('click', close), 0);
    }
  };
  document.getElementById('unmatchBtn').onclick = ()=>{ threadMenu.classList.remove('open'); openUnmatchConfirm(a.id); };
  document.getElementById('blockBtn').onclick = ()=>{ threadMenu.classList.remove('open'); openBlockConfirm(a.id); };
  const rf = document.getElementById('revealFaceBtn'); if(rf) rf.onclick = ()=>openFaceReveal(a.id);
  const ra = document.getElementById('reFaceBtn'); if(ra) ra.onclick = ()=>faceRevealStep(a);
  const wf = document.getElementById('waitFaceBtn'); if(wf) wf.onclick = ()=>{
    revealDeferred.add(a.id); renderThread();
    // (prototype) simulate the other person choosing to show their face a moment later → dot on the eye
    setTimeout(()=>{ if(state.view==='thread' && state.threadAd===a.id && !revealedAdIds.has(a.id)){ revealOffered.add(a.id); renderThread(); } }, 2200);
  };
  const eye = document.getElementById('eyeBtn'), eyeWrap = eye.closest('.th-eye-wrap');
  eye.onclick = ()=>{
    if(revealed){ faceRevealStep(a); }
    else if(unlocked){ openFaceReveal(a.id); }
    else {  // locked: surface the tooltip (hover shows it too, but this covers a click)
      eyeWrap.classList.add('tip-show');
      clearTimeout(eyeWrap._tipT);
      eyeWrap._tipT = setTimeout(()=>eyeWrap.classList.remove('tip-show'), 2800);
    }
  };
  const ci = document.getElementById('composerInput'), sb = document.getElementById('sendBtn');
  ci.addEventListener('input', ()=>{ sb.disabled = ci.value.trim().length === 0; });
  const send = ()=>{
    const t = ci.value.trim(); if(!t) return;
    msgs.push({who:'me', text:t});
    renderThread();
    scroll.scrollTop = scroll.scrollHeight;
    // simulated reply so both sides accumulate (prototype only)
    setTimeout(()=>{
      if(state.view!=='thread' || state.threadAd!==a.id) return;
      msgs.push({who:'them', text: REPLIES[theirs % REPLIES.length]});
      renderThread();
      scroll.scrollTop = scroll.scrollHeight;
    }, 650);
  };
  sb.addEventListener('click', send);
  ci.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
}

// ---------- My Ad (edit form) ----------
function checkGroup(name, options, selected, radio, layout, exclusive){
  exclusive = exclusive || [];
  const checks = options.map(o=>{
    if(o === 'Write in…'){
      // the write-in option is itself an editable field
      return `<div class="check writein-check ${radio?'radio':''}" data-group="${name}" data-val="Write in…"><span class="bx"></span><input class="writein-field" type="text" maxlength="50" placeholder="Write in…"></div>`;
    }
    const sel = selected.includes(o);
    const exc = exclusive.includes(o) ? ' data-exclusive="1"' : '';
    return `<button class="check ${radio?'radio':''} ${sel?'sel':''}" data-group="${name}" data-val="${o}"${exc}><span class="bx"></span>${o}</button>`;
  }).join('');
  return `<div class="checks${layout?' '+layout:''}">${checks}</div>`;
}
// The ad's identity spec-grid, showing only fields that have a value (sexuality only if opted in).
function adMetaGrid(a){
  const rows = [];
  const add = (label, val)=>{ const s = Array.isArray(val) ? val.join(', ') : (val||''); if(s) rows.push(`<div><span>${label}</span>${s}</div>`); };
  add('Gender', a.gender);
  add('Race / ethnicity', a.race);
  add('Religion', a.religion);
  add('Pronouns', a.pronouns);
  if(a.showSexuality) add('Sexuality', a.sexuality);
  add('Politics', a.politics);
  add('Kids', a.kids);
  add('Looking for', a.relationship);
  add('Relationship style', a.relstyle);
  add('Appearance', a.weight);
  return rows.length ? `<div class="myad-meta">${rows.join('')}</div>` : '';
}

// collapsible field row: label + current-selection summary, expands to the picker
function accField(label, bodyHtml, group, emptyText){
  emptyText = emptyText || 'None selected';
  return `<div class="acc" data-acc data-acc-group="${group}" data-acc-empty="${emptyText}"><button type="button" class="acc-head"><span class="acc-label">${label}</span><span class="acc-value" data-acc-value>${emptyText}</span><span class="acc-chev">▾</span></button><div class="acc-body" hidden>${bodyHtml}</div></div>`;
}
// free-text accordion body (e.g. Appearance): "Describe yourself" + a 50-char counter
function appearanceBody(value){
  value = value || '';
  return `<div class="lab-row" style="margin-bottom:8px"><label class="lab">Describe yourself</label><span class="counter" data-acc-counter>${value.length}/50</span></div>
    <textarea class="acc-text-field" data-acc-text maxlength="50" placeholder="ex. tall, glasses, goth">${value}</textarea>`;
}
// read a free-text accordion's value out of a container
function accText(container, group){
  const t = container.querySelector(`[data-acc][data-acc-group="${group}"] [data-acc-text]`);
  return t ? t.value.trim() : '';
}
function updateAccSummary(container, group){
  const acc = container.querySelector(`[data-acc][data-acc-group="${group}"]`);
  if(!acc) return;
  const valEl = acc.querySelector('[data-acc-value]');
  const empty = acc.dataset.accEmpty || 'None selected';
  const txt = acc.querySelector('[data-acc-text]');
  if(txt){
    const v = txt.value.trim();
    valEl.textContent = v || empty;
    valEl.classList.toggle('set', v.length>0);
    return;
  }
  const sel = [...acc.querySelectorAll('.check.sel:not(.writein-check)')].map(c=>c.dataset.val);
  const wf = acc.querySelector('.writein-check.sel .writein-field');
  if(wf && wf.value.trim()) sel.push(wf.value.trim());
  valEl.textContent = sel.length ? sel.join(', ') : empty;
  valEl.classList.toggle('set', sel.length>0);
}
function wireAccordions(container){
  container.querySelectorAll('[data-acc]').forEach(acc=>{
    const body = acc.querySelector('.acc-body');
    acc.querySelector('.acc-head').addEventListener('click', ()=>{ body.hidden = !acc.classList.toggle('open'); });
  });
  // live counter for free-text accordion bodies (Appearance)
  container.querySelectorAll('[data-acc-text]').forEach(t=>{
    const cnt = t.parentElement.querySelector('[data-acc-counter]');
    const max = +t.getAttribute('maxlength') || 50;
    const upd = ()=>{ if(cnt){ cnt.textContent = `${t.value.length}/${max}`; cnt.classList.toggle('at-max', t.value.length>=max); } };
    t.addEventListener('input', upd); upd();
  });
  const refresh = ()=>container.querySelectorAll('[data-acc]').forEach(acc=>updateAccSummary(container, acc.dataset.accGroup));
  refresh();
  container.addEventListener('click', (e)=>{
    refresh();
    const chk = e.target.closest('.check.radio:not(.writein-check)');
    if(chk){ const acc = chk.closest('[data-acc]'); if(acc){ acc.classList.remove('open'); acc.querySelector('.acc-body').hidden = true; } }
  });
  container.addEventListener('input', refresh);
}

        <p class="sec-sub">How we reach you.</p>
        <div class="set-card">
          ${setRow('Email — new replies','When someone replies to your ad.', `<button class="toggle on" data-toggle></button>`)}
          ${setRow('Email — new messages','', `<button class="toggle on" data-toggle></button>`)}
          ${setRow('Email — account &amp; billing','', `<button class="toggle on" data-toggle></button>`)}
          ${setRow('Push — new replies','', `<button class="toggle" data-toggle></button>`)}
          ${setRow('Push — new messages','', `<button class="toggle" data-toggle></button>`)}
        </div>
      </div>

      <div class="form-actions" style="justify-content:space-between">
        <button class="btn ghost">Log out</button>
        <button class="btn">Save changes</button>
      </div>
    </div>`;

  // partner preferences overlay
  scroll.querySelector('[data-prefs]')?.addEventListener('click', openPreferences);
  scroll.querySelector('#replayOb')?.addEventListener('click', startOnboarding);
  scroll.querySelector('#guestToggle')?.addEventListener('click', function(){ hasAd = !this.classList.toggle('on'); });
  // toggles
  scroll.querySelectorAll('[data-toggle]').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('on')));
  // single-select segmented (who can message)
  scroll.querySelectorAll('.check').forEach(c=>c.addEventListener('click',()=>{
    scroll.querySelectorAll(`.check[data-group="${c.dataset.group}"]`).forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');
  }));
}

const IC_MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A7.6 7.6 0 0 1 9.6 4 7.6 7.6 0 1 0 20 14.4z"/></svg>`;
const darkBtn = document.getElementById('darkToggle');

// ---------- re-balance masonry on resize (debounced, feed only) ----------
let feedResizeTimer;
window.addEventListener('resize', ()=>{
  if(state.view !== 'feed' || feedMode === 'paper') return; // paper refits via its own ResizeObserver
  clearTimeout(feedResizeTimer);
  feedResizeTimer = setTimeout(()=>{
    const y = scroll.scrollTop;
    renderFeed();
    scroll.scrollTop = y;
  }, 150);
});

// ---------- Onboarding (write your first ad) ----------
let obStep = 0;
const OB_DEFAULT_HFONT = 'Instrument Serif', OB_DEFAULT_BFONT = 'Instrument Sans';
const obData = { name:'', age:'', location:'', headline:'', desc:'', photo:'', headingFont:OB_DEFAULT_HFONT, bodyFont:OB_DEFAULT_BFONT,
  gender:[], pronouns:[], rel:'', race:[], religion:'', sexuality:[], showSexuality:false, politics:'', kids:'', relstyle:'', build:'',
  prefInterest:[], prefAgeMin:'25', prefAgeMax:'45', prefZip:'', prefDist:'Within 25 miles', prefRel:'' };
const obVal = id => { const el = document.getElementById(id); return el ? el.value : ''; };
function obResetData(){ for(const k in obData) obData[k]=''; obData.headingFont=OB_DEFAULT_HFONT; obData.bodyFont=OB_DEFAULT_BFONT; obData.gender=[]; obData.pronouns=[]; obData.race=[]; obData.sexuality=[]; obData.showSexuality=false;
  obData.prefInterest=[]; obData.prefAgeMin='25'; obData.prefAgeMax='45'; obData.prefZip=''; obData.prefDist='Within 25 miles'; obData.prefRel=''; }
function startOnboarding(){ obStep = 0; obResetData(); document.getElementById('onboarding').classList.add('open'); renderOnboarding(); }
// Read the selected values of a checkGroup out of a container (mirrors updateAccSummary).
function obChecked(container, group){
  const acc = container.querySelector(`[data-acc][data-acc-group="${group}"]`);
  if(!acc) return [];
  const sel = [...acc.querySelectorAll('.check.sel:not(.writein-check)')].map(c=>c.dataset.val);
  const wf = acc.querySelector('.writein-check.sel .writein-field');
  if(wf && wf.value.trim()) sel.push(wf.value.trim());
  return sel;
}
function endOnboarding(){ document.getElementById('onboarding').classList.remove('open'); }
function obSaveStep(){
  if(obStep===1){ obData.name=obVal('obName'); obData.age=obVal('obAge'); obData.location=obVal('obLoc'); }
  if(obStep===2){ obData.headline=obVal('obHead'); obData.desc=obVal('obDesc'); }
  if(obStep===3){ obSaveAbout(); }
  if(obStep===5){ obSavePrefs(); }
  // step 4 (photo) is saved on upload
}
// Read the About-you identity fields out of the DOM into obData.
function obSaveAbout(){
  const c = document.getElementById('obBody'); if(!c || !c.querySelector('[data-acc]')) return;
  obData.gender    = obChecked(c,'gender');
  obData.pronouns  = obChecked(c,'pronouns');
  obData.rel       = obChecked(c,'rel')[0] || '';
  obData.race      = obChecked(c,'race');
  obData.religion  = obChecked(c,'religion')[0] || '';
  obData.sexuality = obChecked(c,'sexuality');
  obData.politics  = obChecked(c,'politics')[0] || '';
  obData.kids      = obChecked(c,'kids')[0] || '';
  obData.relstyle  = obChecked(c,'relstyle')[0] || '';
  obData.build     = accText(c, 'appearance');
  const tog = c.querySelector('[data-toggle]');
  obData.showSexuality = tog ? tog.classList.contains('on') : obData.showSexuality;
}
// Read the preferences step out of the DOM into obData.
function obSavePrefs(){
  const c = document.getElementById('obBody'); if(!c) return;
  obData.prefInterest = obChecked(c,'prefInterest');
  obData.prefRel      = obChecked(c,'prefRel')[0] || '';
  obData.prefAgeMin   = obVal('prefAgeMin');
  obData.prefAgeMax   = obVal('prefAgeMax');
  obData.prefZip      = obVal('prefZip');
  obData.prefDist     = obVal('prefDist');
}
// Required fields per step — the Next/Post button stays disabled until they're filled.
function obValidate(){
  const btn = document.getElementById('obNext') || document.getElementById('obPost');
  if(!btn) return;
  let ok = true;
  if(obStep===1) ok = ['obName','obAge','obLoc'].every(id=>obVal(id).trim());
  else if(obStep===2) ok = ['obHead','obDesc'].every(id=>obVal(id).trim());
  else if(obStep===3){ const c=document.getElementById('obBody'); ok = ['gender','pronouns','rel'].every(g=>obChecked(c,g).length>0); }
  else if(obStep===5){ const c=document.getElementById('obBody'); ok = obChecked(c,'prefInterest').length>0; }
  else if(obStep>=6) ok = ['name','age','location','headline','desc'].every(k=>String(obData[k]).trim()) && obData.gender.length>0 && obData.pronouns.length>0 && !!obData.rel;
  btn.disabled = !ok;
}
function photoSlotHtml(){
  if(obData.photo){
    return `<div class="photo-prev">
      <img class="thumb" src="${obData.photo}" alt="Your photo">
      <div class="pp-meta">
        <span class="pp-lock">${IC_LOCK} Only you can see this now</span>
        <button class="pp-replace" id="photoReplace">Replace photo</button>
      </div></div>`;
  }
  return `<div class="photo-drop" id="photoDrop"><div class="pu-ico">⬆</div><strong>Upload a photo</strong><span>PNG or JPG</span></div>`;
}
function rebindPhoto(){
  const input = document.getElementById('photoInput'); if(!input) return;
  const drop = document.getElementById('photoDrop'); if(drop) drop.onclick = ()=>input.click();
  const rep = document.getElementById('photoReplace'); if(rep) rep.onclick = ()=>input.click();
}
// The whole ad in one card (used by the confirm + customize steps), rendered with the chosen fonts.
function obAdCard(){
  const d = obData;
  // map onboarding keys → ad keys so the shared grid can render it
  const meta = adMetaGrid({ gender:d.gender, race:d.race, religion:d.religion, pronouns:d.pronouns, showSexuality:d.showSexuality, sexuality:d.sexuality, politics:d.politics, kids:d.kids, relationship:d.rel, relstyle:d.relstyle, weight:d.build });
  return `<div class="myad-card">
    <div class="ad-name" style="${hstyle(d.headingFont)}">${d.name||'Your name'}, ${d.age||'—'}</div>
    <div class="ad-place">${d.location||'Your city'}</div>
    <div class="ad-headline" style="font-family:${cssFor(d.bodyFont)}">${d.headline||'Your headline'}</div>
    <p class="myad-desc" style="font-family:${cssFor(d.bodyFont)}">${d.desc||'Your ad copy will show here.'}</p>
    ${meta}
  </div>`;
}
// Reminder that a (hidden) photo is attached, with a tiny thumbnail.
function obPhotoNote(){
  if(!obData.photo) return '';
  return `<div class="photo-attached"><img class="pa-thumb" src="${obData.photo}" alt="Your photo"><span>${IC_LOCK} Photo attached — hidden until you both choose to reveal.</span></div>`;
}
function finishOnboarding(){
  const d = obData;
  if(d.name) MY_AD.name=d.name; if(d.age) MY_AD.age=d.age; if(d.location) MY_AD.location=d.location;
  if(d.headline) MY_AD.headline=d.headline; if(d.desc) MY_AD.desc=d.desc; if(d.photo) MY_AD.photo=d.photo;
  if(d.headingFont) MY_AD.headingFont=d.headingFont; if(d.bodyFont) MY_AD.bodyFont=d.bodyFont;
  // identity — write everything the user entered; blanks clear the sample defaults so nothing phantom shows
  MY_AD.gender=d.gender; MY_AD.pronouns=d.pronouns; MY_AD.relationship=d.rel;
  MY_AD.race=d.race; MY_AD.sexuality=d.sexuality; MY_AD.showSexuality=d.showSexuality;
  MY_AD.religion=d.religion; MY_AD.politics=d.politics; MY_AD.kids=d.kids; MY_AD.relstyle=d.relstyle; MY_AD.weight=d.build;
  if(d.prefInterest.length) PREFS.interest = d.prefInterest;
  if(d.prefAgeMin) PREFS.ageMin = d.prefAgeMin; if(d.prefAgeMax) PREFS.ageMax = d.prefAgeMax;
  PREFS.zip = d.prefZip; if(d.prefDist) PREFS.dist = d.prefDist; if(d.prefRel) PREFS.rel = d.prefRel;
  hasAd = true; // posting your ad unlocks the feed
  endOnboarding(); setView('myad');
}
const HIW_CARDS = [
  {n:'01', h:"You'll meet through writing", p:"Classy has no photo grid and nothing to swipe. Everyone posts a personal ad — a few honest lines about who they are and who they're hoping to find."},
  {n:'02', h:"Browse the day's personals", p:"Each day brings a fresh paper, laid out like the classifieds. No algorithm rushing you — just read, and see whose words stay with you."},
  {n:'03', h:"Reply, and take your time", p:"Write to the ones who catch you. Here you get to know a person before you ever see their face — the conversation is the whole point."},
  {n:'04', h:"Faces, when you're both ready", p:"Photos stay private until you both choose to share them. A reveal is always mutual, never one-sided — no pressure, no surprises."},
];
let hiwIndex = -1;
function openHowItWorks(){ hiwIndex = 0; renderHowItWorks(); }
function renderHowItWorks(){
  const body = document.getElementById('obBody'), nav = document.getElementById('obNav'), dots = document.getElementById('obDots');
  const c = HIW_CARDS[hiwIndex], last = hiwIndex === HIW_CARDS.length - 1;
  dots.innerHTML = HIW_CARDS.map((_,k)=>`<span class="ob-dot ${k===hiwIndex?'on':''}"></span>`).join('');
  body.innerHTML = `<div class="hiw"><div class="hiw-kicker">How it works</div><div class="hiw-illus"></div><h2 class="hiw-h">${c.h}</h2><p class="hiw-p">${c.p}</p></div>`;
  nav.innerHTML = `<button class="btn ghost" id="hiwBack">Back</button><button class="btn" id="hiwNext">${last?'Write my ad':'Next'}</button>`;
  document.getElementById('hiwBack').onclick=()=>{ if(hiwIndex===0){ hiwIndex=-1; renderOnboarding(); } else { hiwIndex--; renderHowItWorks(); } };
  document.getElementById('hiwNext').onclick=()=>{ if(last){ hiwIndex=-1; obStep=1; renderOnboarding(); } else { hiwIndex++; renderHowItWorks(); } };
}
function renderOnboarding(){
  const body = document.getElementById('obBody'), nav = document.getElementById('obNav'), dots = document.getElementById('obDots');
  const TOTAL = 5; // basics · personal · about you · photo (confirm + customize are terminal, no dots)
  dots.innerHTML = (obStep>=1 && obStep<=TOTAL) ? Array.from({length:TOTAL},(_,k)=>`<span class="ob-dot ${k===obStep-1?'on':''}"></span>`).join('') : '';
  if(obStep===0){
    body.innerHTML = `<div class="ob-welcome"><div class="ob-brand">Classy</div><div class="ob-tag">Seek. Find.</div><h2>No photos. Just words.</h2><p>On Classy you meet through what you write. Let's put your personal in tomorrow's paper.</p></div>`;
    nav.innerHTML = `<div class="ob-welcome-nav"><button class="btn block" id="obNext">Write my ad</button><button class="hiw-link" id="obHiw">How it works</button></div>`;
  } else if(obStep===1){
    body.innerHTML = `<div class="ob-step"><h2>The basics</h2>
      <div class="fgroup"><label class="lab">Your name <span class="req-mark">*</span></label><input class="field-in" id="obName" value="${obData.name}" placeholder="First name"></div>
      <div style="display:flex;gap:16px">
        <div class="fgroup" style="flex:0 0 110px"><label class="lab">Age <span class="req-mark">*</span></label><input class="field-in" id="obAge" value="${obData.age}" placeholder="e.g. 30"></div>
        <div class="fgroup" style="flex:1"><label class="lab">Location <span class="req-mark">*</span></label><input class="field-in" id="obLoc" value="${obData.location}" placeholder="Neighborhood, City"></div>
      </div></div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><button class="btn" id="obNext">Next</button>`;
  } else if(obStep===2){
    body.innerHTML = `<div class="ob-step"><h2>Your personal</h2>
      <p class="ob-sub">A headline to catch the eye, then the ad itself. Specifics beat adjectives.</p>
      <div class="fgroup"><div class="lab-row"><label class="lab">Headline <span class="req-mark">*</span></label><span class="counter" id="obHeadCnt"></span></div><input class="field-in" id="obHead" maxlength="250" value="${obData.headline}" placeholder="e.g. Quiet but not shy"></div>
      <div class="fgroup"><div class="lab-row"><label class="lab">Description <span class="req-mark">*</span></label><span class="counter" id="obDescCnt"></span></div><textarea class="field-in autogrow" id="obDesc" maxlength="1000" placeholder="I read a lot, take long walks and notice small things…">${obData.desc}</textarea></div></div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><button class="btn" id="obNext">Next</button>`;
  } else if(obStep===3){
    body.innerHTML = `<div class="ob-step"><h2>About you</h2>
      <p class="ob-sub">A few details for your ad. Only gender, pronouns, and what you're looking for are required — the rest is up to you.</p>
      ${accField('Gender <span class="req-mark">*</span>', checkGroup('gender',['Man','Woman','Trans man','Trans woman','Non-binary','Write in…'],obData.gender,false,'grid2'), 'gender')}
      ${accField('Pronouns <span class="req-mark">*</span>', checkGroup('pronouns',['he/him','she/her','they/them','Write in…'],obData.pronouns,false,'grid2'), 'pronouns')}
      ${accField('Looking for <span class="req-mark">*</span>', checkGroup('rel',['Hookup','Not sure','Something serious'],[obData.rel],true,'stacked'), 'rel')}
      <div class="ob-optional-head">Optional — add anything you'd like on your ad</div>
      ${accField('Race / ethnicity', checkGroup('race',['Asian','Black','Hispanic / Latino','Indigenous','Middle Eastern','Pacific Islander','White','Mixed','Prefer not to say','Write in…'],obData.race,false,'grid2',['Prefer not to say']), 'race')}
      ${accField('Religion', checkGroup('religion',['Agnostic','Atheist','Buddhist','Christian','Hindu','Jewish','Muslim','Sikh','Prefer not to say','Write in…'],[obData.religion],true,'grid2'), 'religion')}
      ${accField('Sexuality', `<div class="soa-row"><span class="soa-lab">Show on my ad</span><button class="toggle ${obData.showSexuality?'on':''}" data-toggle></button></div>${checkGroup('sexuality',['Straight','Gay','Lesbian','Bisexual','Pansexual','Queer','Asexual','Prefer not to say','Write in…'],obData.sexuality,false,'stacked',['Prefer not to say'])}`, 'sexuality')}
      ${accField('Political views', checkGroup('politics',['Liberal','Conservative','Centrist','Write in…'],[obData.politics],true,'grid2'), 'politics')}
      ${accField('Kids', checkGroup('kids',['Wants kids',"Doesn't want kids",'Has kids','Not sure yet'],[obData.kids],true,'grid2'), 'kids')}
      ${accField('Relationship style', checkGroup('relstyle',['Monogamous','Non-monogamous','Open to non-monogamy'],[obData.relstyle],true,'stacked'), 'relstyle')}
      ${accField('Appearance', appearanceBody(obData.build), 'appearance', 'Write in…')}</div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><button class="btn" id="obNext">Next</button>`;
  } else if(obStep===4){
    body.innerHTML = `<div class="ob-step"><h2>Add your photo <span class="hint">optional</span></h2>
      <p class="ob-sub">No one sees this on your ad. It stays hidden until you and someone both choose to trade faces — and you can add it anytime from My Ad.</p>
      <input type="file" accept="image/*" id="photoInput" hidden>
      <div id="photoSlot">${photoSlotHtml()}</div>
      <div class="photo-privacy">${IC_LOCK} Hidden until a mutual face reveal — never shown on your public ad.</div></div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><button class="btn" id="obNext">${obData.photo?'Next':'Add photo later'}</button>`;
  } else if(obStep===5){
    body.innerHTML = `<div class="ob-step"><h2>Who you're looking for</h2>
      <p class="ob-sub">This shapes who lands in your Today's Picks. You can get more specific anytime in Settings.</p>
      ${accField('Interested in <span class="req-mark">*</span>', checkGroup('prefInterest',['Men','Women','Trans men','Trans women','Non-binary','Everyone'],obData.prefInterest,false,'grid2',['Everyone']), 'prefInterest')}
      <div class="fgroup"><label class="lab">Age range</label>
        <div style="display:flex;align-items:center;gap:10px">
          <input class="field-in" id="prefAgeMin" value="${obData.prefAgeMin}" style="width:74px" inputmode="numeric">
          <span style="color:var(--muted)">to</span>
          <input class="field-in" id="prefAgeMax" value="${obData.prefAgeMax}" style="width:74px" inputmode="numeric">
        </div></div>
      <div style="display:flex;gap:16px">
        <div class="fgroup" style="flex:1"><label class="lab">ZIP code</label><input class="field-in" id="prefZip" value="${obData.prefZip}" placeholder="e.g. 94110" inputmode="numeric" maxlength="5"></div>
        <div class="fgroup" style="flex:1"><label class="lab">Distance</label><input class="field-in" id="prefDist" value="${obData.prefDist}"></div>
      </div>
      ${accField('Relationship type', checkGroup('prefRel',['Hookup','Not sure','Something serious'],[obData.prefRel],true,'stacked'), 'prefRel')}</div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><button class="btn" id="obNext">Next</button>`;
  } else {
    body.innerHTML = `<div class="ob-step"><div class="ob-kicker">Optional</div><h2>Make it yours</h2>
      <p class="ob-sub">Here's your whole ad. Give it a font that fits your vibe, or post as-is — you can refine anything anytime in My Ad.</p>
      <div id="obCustPreview">${obAdCard()}</div>
      <div class="cust-drops">
        <label class="drop"><span class="drop-label">Name font</span>
          <select class="drop-select" id="obHeadSel" style="font-family:${cssFor(obData.headingFont)}">
            ${HEADING_FONTS.map(f=>`<option value="${f.name}" style="font-family:${f.css}"${f.name===obData.headingFont?' selected':''}>${f.name} · ${f.vibe}</option>`).join('')}
          </select></label>
        <label class="drop"><span class="drop-label">Body font</span>
          <select class="drop-select" id="obBodySel" style="font-family:${cssFor(obData.bodyFont)}">
            ${BODY_FONTS.map(f=>`<option value="${f.name}" style="font-family:${f.css}"${f.name===obData.bodyFont?' selected':''}>${f.name}</option>`).join('')}
          </select></label>
      </div>
      ${obPhotoNote()}</div>`;
    nav.innerHTML = `<button class="btn ghost" id="obBack">Back</button><button class="btn" id="obPost">Post my ad</button>`;
  }
  const next=document.getElementById('obNext'), back=document.getElementById('obBack'), post=document.getElementById('obPost');
  if(next) next.onclick=()=>{ obSaveStep(); obStep++; renderOnboarding(); };
  if(back) back.onclick=()=>{ obSaveStep(); obStep--; renderOnboarding(); };
  if(post) post.onclick=()=>{ obSaveStep(); finishOnboarding(); };
  const hiw=document.getElementById('obHiw'); if(hiw) hiw.onclick=openHowItWorks;
  const later=document.getElementById('obLater');
  if(later) later.onclick=()=>{ finishOnboarding(); };
  // optional customization — live font preview
  const obHeadSel=document.getElementById('obHeadSel'), obBodySel=document.getElementById('obBodySel'), obPv=document.getElementById('obCustPreview');
  if(obHeadSel) obHeadSel.addEventListener('change', ()=>{ obData.headingFont=obHeadSel.value; obHeadSel.style.fontFamily=cssFor(obData.headingFont); if(obPv) obPv.innerHTML=obAdCard(); });
  if(obBodySel) obBodySel.addEventListener('change', ()=>{ obData.bodyFont=obBodySel.value; obBodySel.style.fontFamily=cssFor(obData.bodyFont); if(obPv) obPv.innerHTML=obAdCard(); });
  const bindCnt=(id,cntId,max)=>{ const el=document.getElementById(id),cnt=document.getElementById(cntId); if(!el||!cnt)return; const u=()=>{cnt.textContent=`${el.value.length}/${max}`;cnt.classList.toggle('at-max',el.value.length>=max);}; el.addEventListener('input',u); u(); };
  bindCnt('obHead','obHeadCnt',250); bindCnt('obDesc','obDescCnt',1000);
  const desc=document.getElementById('obDesc');
  if(desc){ const grow=()=>{desc.style.height='auto';desc.style.height=desc.scrollHeight+'px';}; desc.addEventListener('input',grow); grow(); }
  // live required-field validation + photo upload
  ['obName','obAge','obLoc','obHead','obDesc'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', obValidate); });
  const photoInput=document.getElementById('photoInput');
  if(photoInput){ photoInput.onchange=()=>{ const f=photoInput.files&&photoInput.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=e=>{ obData.photo=e.target.result; const slot=document.getElementById('photoSlot'); if(slot) slot.innerHTML=photoSlotHtml(); rebindPhoto(); const nx=document.getElementById('obNext'); if(nx) nx.textContent='Next'; obValidate(); }; rd.readAsDataURL(f); }; }
  rebindPhoto();
  // About-you + preferences accordions — wire to the fresh step element so listeners don't accumulate on #obBody
  if(obStep===3 || obStep===5){
    const stepEl = body.querySelector('.ob-step');
    if(stepEl){
      wireChecks(stepEl);
      stepEl.querySelectorAll('[data-toggle]').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('on')));
      wireAccordions(stepEl);
      stepEl.addEventListener('click', obValidate);
      stepEl.addEventListener('input', obValidate);
    }
  }
  obValidate();
}

document.getElementById('topDate').innerHTML = '<span class="date-label">Issue Date</span><span class="date-val">' + TODAY_STR + '</span>';
updateMsgBadge();
setView('feed');
// fonts change card heights — re-balance the masonry once they've loaded
if(document.fonts) document.fonts.ready.then(()=>{ if(state.view==='feed') renderFeed(); });
